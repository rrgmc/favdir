name: release

# Publishing a GitHub release tagged vX.Y.Z (or X.Y.Z) builds and tests favdir, then attaches
# the Windows setup to the release. To redo it for an existing release, run the workflow by
# hand with the tag: the code comes from the tag, this file from the branch it runs on.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v5

      - name: Install Ninja and NSIS
        run: choco install ninja nsis -y --no-progress

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Version from tag
        id: version
        shell: bash
        run: |
          tag="$TAG"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$tag' is not vX.Y.Z or X.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/setup.*') }}

      - name: Download Qt
        run: pwsh -File scripts/setup.ps1

      - name: Configure
        # bash, not PowerShell: PowerShell splits -DFAVDIR_VERSION=1.0.0 at the first dot.
        shell: bash
        run: cmake --preset windows-ninja "-DFAVDIR_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build --preset windows-ninja

      - name: Test
        run: ctest --preset windows-ninja

      - name: Build setup
        working-directory: build/windows-ninja
        run: cpack -C Release

      - name: Attach setup to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "build/windows-ninja/favdir-${{ steps.version.outputs.version }}-win64.exe" --clobber
