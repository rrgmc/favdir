name: release

# Pushing a tag vX.Y.Z checks it, builds and tests favdir, makes the Windows setup and the
# notarised macOS disk image, then publishes the GitHub release with both attached. Nothing is
# published unless both builds succeed. To redo it for an existing tag, run the workflow by hand
# with the tag: the code comes from the tag, this file from the branch it runs on, and the files
# of an existing release are replaced.
# The tag check and the publishing come from RangelReale/personal-ai-rules.
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag is vX.Y.Z (or vX.Y.Z-rc.N, a prerelease) and on master. The version is the tag's:
  # nothing in the tree holds it, and the builds pass it as -DFAVDIR_VERSION.
  check:
    uses: RangelReale/personal-ai-rules/.github/workflows/release-check.yml@v0.2.1
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  windows-setup:
    needs: check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v5

      # NSIS comes from Chocolatey, whose feed is sometimes down (503/504) for minutes at a time.
      # Keep the installed NSIS in the cache so a release does not depend on the feed, and retry
      # the install when the cache is empty. The runner image already has Ninja.
      - name: Cache NSIS
        id: nsis-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-${{ runner.os }}-1

      - name: Install NSIS
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        run: |
          foreach ($attempt in 1..5) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "choco install failed (attempt $attempt), retrying in 60 s"
            Start-Sleep -Seconds 60
          }
          exit 1

      - name: Put NSIS on the PATH
        run: |
          "C:\Program Files (x86)\NSIS" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/setup.*') }}

      - name: Download Qt
        run: pwsh -File scripts/setup.ps1

      - name: Configure
        # bash, not PowerShell: PowerShell splits -DFAVDIR_VERSION=1.0.0 at the first dot.
        shell: bash
        run: cmake --preset windows-ninja "-DFAVDIR_VERSION=${{ needs.check.outputs.version }}"

      - name: Build
        run: cmake --build --preset windows-ninja

      - name: Test
        run: ctest --preset windows-ninja

      - name: Build setup
        working-directory: build/windows-ninja
        run: cpack -C Release

      # release-publish attaches the release-* artifacts of this run.
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/windows-ninja/favdir-${{ needs.check.outputs.version }}-win64.exe
          if-no-files-found: error
          retention-days: 7

  macos-dmg:
    needs: check
    runs-on: macos-latest
    # The signing secrets live in this environment. It only admits v* tags and master, and it
    # can require an approval before each run.
    environment: release

    steps:
      # Pinned to commits: this job holds the signing secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Ninja
        run: brew install ninja

      # A keychain of its own, with a random password, holds the Developer ID certificate for
      # this job only. The last step deletes it.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      # Checks the key before the build, and shows notarytool's error if Apple refuses it.
      - name: Write and check the notarisation key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_API_ISSUER" > /dev/null

      - name: Build, test, sign and notarise
        env:
          FAVDIR_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          FAVDIR_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          FAVDIR_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: sh scripts/release-macos.sh "${{ needs.check.outputs.version }}"

      # release-publish attaches the release-* artifacts of this run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: build/macos-release/favdir-${{ needs.check.outputs.version }}-macos.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"

  # Publishes the release (generated notes, as favdir keeps no CHANGELOG.md) with both files and a
  # SHA256SUMS.txt, or replaces the files of a release that exists.
  publish:
    needs: [check, windows-setup, macos-dmg]
    permissions:
      contents: write
    uses: RangelReale/personal-ai-rules/.github/workflows/release-publish.yml@v0.2.1
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
