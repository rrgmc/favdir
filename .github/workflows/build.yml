name: build

on:
  # Tags start release.yml, which builds and tests on its own.
  push:
    branches: ['**']
  pull_request:

jobs:
  # Decides whether the change touches anything besides documentation.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Compare with the pull request's base, the previous tip of the pushed branch, or, for
          # a new branch, where it left the default branch. With no usable base, build anyway.
          base=""
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)
          fi

          code=true
          if [ -n "$base" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                "") ;;
                *.md | docs/* | LICENSE) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # The runner's Visual Studio version changes over time; Ninja works with any.
            preset: windows-ninja
            setup: pwsh -File scripts/setup.ps1
          - os: macos-latest
            preset: macos
            setup: sh scripts/setup.sh
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/setup.*') }}

      - name: Download Qt
        run: ${{ matrix.setup }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cmake --install build/${{ matrix.preset }} --config Release --prefix "$PWD/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: favdir-${{ matrix.preset }}
          path: dist

  # The one check branch protection requires. It passes when the build passed, or was skipped
  # because only documentation changed, so the matrix can change without touching protection.
  ci:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES, build: $BUILD"
          case "$CHANGES/$BUILD" in
            success/success | success/skipped) ;;
            *) exit 1 ;;
          esac
